<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F0EB"><title>Sem conexão — Comunidade PONCI</title>
<style>html,body{margin:0;height:100%;background:#F2F0EB;color:#121211;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){html,body{background:#131312;color:#EDEAE3}}
main{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(24px + env(safe-area-inset-top)) 24px 24px;box-sizing:border-box;max-width:520px;margin:0 auto}
b{font:900 44px/.9 "Arial Black",Arial,sans-serif;letter-spacing:-1px;text-transform:uppercase}
p{font-size:17px;line-height:1.5;margin:0;opacity:.8}
button{align-self:flex-start;min-height:48px;padding:0 22px;border:0;background:#121211;color:#F2F0EB;font:700 14px/1 Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-color-scheme:dark){button{background:#EDEAE3;color:#131312}}
i{display:block;width:34px;height:34px;background:#8B6A4F}</style></head>
<body><main><i></i><b>Sem conexão</b><p>A Comunidade precisa de internet para mostrar as notas mais recentes. Assim que a conexão voltar, é só tentar de novo.</p>
<button onclick="location.reload()">Tentar de novo</button></main></body></html>
