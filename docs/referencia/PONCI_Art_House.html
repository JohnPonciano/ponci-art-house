<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PONCI Art House</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="PONCI is an independent contemporary art house from Brazil, est. 2026. Works, collections and private acquisitions. Website prototype with demonstration content.">
<meta property="og:title" content="PONCI — Contemporary Art House">
<meta property="og:description" content="An independent exploration of contemporary artistic expression. Brazil, est. 2026.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: béton brut — Paulista brutalism. The 12-column grid is left exposed as 2px structural
   rules; content is poured into ruled cells; concrete slabs (formwork board marks, tie holes) hold the art.
   Heavy expanded grotesk for structure, an italic serif for the human voice, mono for catalogue data.
   Single deliberate light theme on the brand palette. */
:root{
  color-scheme:light;
  --paper:#F2F0EB;      /* warm off-white */
  --field:#FBFAF7;      /* input fill on focus */
  --slab:#C6C2BA;       /* concrete */
  --slab-lt:#DAD6CF;    /* light concrete for cards */
  --ink:#121211;        /* near-black */
  --ink-line:#3A3936;   /* rules on black */
  --ink-ghost:#2B2A28;  /* ghost type on black */
  --muted:#5D5B56;      /* mineral gray, text-safe */
  --hair:#CDC9C1;       /* hairline */
  --ocre:#8B6A4F;       /* earthy accent */
  --on-ink:#F2F0EB;
  --on-ink-muted:#A9A69F;
  --error:#A3341F;
  --grot:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --b:2px solid var(--ink);
  --gutter:clamp(16px,3vw,40px);
  --tex:none;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--grot);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{max-width:100%}
p{margin:0}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
em{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.005em;font-stretch:100%}
:focus-visible{outline:2px solid var(--ocre);outline-offset:3px}
.wrap{max-width:1680px;margin-inline:auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.lab{font:500 11px/1.45 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--paper);padding:10px 14px;border:0;font:500 12px var(--mono)}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter;flex:none}

/* Prototype bar */
.protobar{background:var(--ink);color:var(--on-ink)}
.protobar .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:7px;font:500 10.5px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.protobar .dot{display:inline-block;width:7px;height:7px;background:var(--ocre);margin-right:10px}
@media (max-width:600px){#pb-r{display:none}}

/* Header */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:var(--b)}
.head .wrap{display:flex;align-items:stretch;justify-content:space-between;height:64px}
#brand{display:flex}
.wordmark{display:flex;align-items:center;gap:14px;padding-right:18px}
.wordmark b{font:900 26px/1 var(--grot);font-stretch:125%;letter-spacing:-.035em}
.wordmark small{font:500 10px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);max-width:14ch;border-left:var(--b);padding-left:12px}
.nav{display:flex;align-items:stretch}
.nav ul{display:flex;list-style:none;margin:0;padding:0}
.nav li{display:flex}
.nav a{display:flex;align-items:center;gap:9px;padding:0 clamp(12px,1.4vw,22px);border-left:var(--b);font:700 12px/1 var(--grot);letter-spacing:.07em;text-transform:uppercase;transition:background .2s,color .2s}
.nav a span{font:500 10px/1 var(--mono);color:var(--muted);letter-spacing:0}
.nav a:hover{background:var(--slab-lt)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.nav a[aria-current="page"] span{color:var(--on-ink-muted)}
.nav > .lang{border-left:var(--b);padding-left:clamp(12px,1.4vw,20px)}
.lang{display:flex;align-items:center}
.lang > span{display:none}
.lang button{background:none;border:var(--b);padding:6px 9px;font:500 11px/1 var(--mono);letter-spacing:.04em;cursor:pointer;color:var(--ink)}
.lang button + span + button{border-left:0}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.menu-btn{display:none;background:none;border:0;border-left:var(--b);padding:0 0 0 16px;cursor:pointer;align-items:center;gap:10px;font:700 12px/1 var(--grot);letter-spacing:.07em;text-transform:uppercase}
.menu-btn .ico{width:20px;height:20px}
@media (max-width:1200px){.wordmark small{display:none}}
@media (max-width:1000px){.nav{display:none}.menu-btn{display:inline-flex}}
.menu[hidden]{display:none}
.menu{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.menu .top{display:flex;align-items:stretch;justify-content:space-between;height:64px;border-bottom:var(--b)}
.menu ul{list-style:none;margin:0;padding:0}
.menu li{border-bottom:var(--b)}
.menu ul a{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:16px;font:800 clamp(2rem,9vw,3rem)/1 var(--grot);font-stretch:87.5%;text-transform:uppercase;letter-spacing:-.01em}
.menu ul a span{font:500 12px var(--mono);color:var(--muted)}
.menu ul a[aria-current="page"]{color:var(--ocre)}
.menu .foot2{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px;border-top:var(--b)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:28px;padding:18px 20px;border:var(--b);background:var(--ink);color:var(--on-ink);font:700 12px/1 var(--grot);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--ocre);border-color:var(--ocre)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn .ico,.arrow .ico{width:16px;height:16px;transition:transform .3s var(--ease)}
.btn:hover .ico,.arrow:hover .ico{transform:translateX(4px)}
.btn[disabled]{opacity:.6;cursor:progress}

main{display:block;outline:none}
main:focus,main:focus-visible{outline:none}
.enter{animation:enter .55s var(--ease) both}
@keyframes enter{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
img[data-art]{transition:opacity .8s var(--ease),transform 1.2s var(--ease)}
img[data-art]:not(.ready){opacity:0}

/* Fitted display type */
.fit{display:block;white-space:nowrap;font:900 120px/.84 var(--grot);font-stretch:125%;letter-spacing:-.045em;text-transform:uppercase;padding-top:.05em}
.fit > span{display:inline-block}
.fit.acc{padding-top:.2em;padding-bottom:.14em}
.fit.nofit{white-space:normal;font-size:clamp(2.6rem,12vw,4.6rem);font-stretch:87.5%;letter-spacing:-.02em;line-height:.9}

/* Concrete slab */
.slab{position:relative;background-color:var(--slab);background-image:var(--tex);background-size:640px 640px;height:var(--h,clamp(460px,78vh,880px));overflow:hidden}
.slab .hang{position:absolute;inset:0 0 52px;display:flex;align-items:center;justify-content:center;padding:clamp(28px,6%,90px)}
.slab.np .hang{bottom:0}
.slab .hang img{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(14px 18px 16px rgba(18,18,17,.28)) drop-shadow(1px 2px 2px rgba(18,18,17,.25))}
.plaque{position:absolute;left:0;bottom:0;max-width:100%;background:var(--ink);color:var(--on-ink);padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.plaque b{font:700 13px/1.2 var(--grot);letter-spacing:.03em}
.plaque span{color:var(--on-ink-muted)}

/* Hero */
.hero .mega{margin-left:-.03em}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:var(--b);border-bottom:var(--b);margin-top:clamp(8px,1.2vw,16px)}
.strip > *{padding:12px 14px;border-left:var(--b);font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;min-width:0}
.strip > :first-child{border-left:0;padding-left:0}
@media (max-width:800px){
  .strip{grid-template-columns:1fr 1fr}
  .strip > *{border-left:0;border-top:1px solid var(--hair);padding-left:0}
  .strip > :nth-child(-n+2){border-top:0}
  .strip > :nth-child(even){border-left:var(--b);padding-left:14px}
}
.hero-body{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-bottom:var(--b)}
.hero-body > *{min-width:0}
.hero-text{grid-column:1/5;display:flex;flex-direction:column;gap:24px;padding:clamp(24px,3vw,44px) clamp(16px,2.4vw,36px) clamp(20px,2.4vw,32px) 0;border-right:var(--b)}
.hero-quote{font:italic 400 clamp(2.3rem,3.6vw,3.7rem)/1 var(--serif);letter-spacing:-.01em}
.hero-sub{color:var(--muted);max-width:34ch}
.hero-ctas{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:20px}
.hero-ctas .btn{width:100%}
.hero-art{grid-column:5/13}
.hero-art .slab{--h:clamp(460px,70vh,800px)}
@media (max-width:900px){
  .hero-text,.hero-art{grid-column:1/-1}
  .hero-text{border-right:0;border-bottom:var(--b);padding-right:0}
  .hero-art .slab{--h:clamp(380px,62vh,580px)}
}

/* Section heads */
.sec{padding-block:clamp(64px,9vw,140px)}
.sec-head{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-top:var(--b);border-bottom:var(--b)}
.sec-head > *{min-width:0}
.sec-head .n{grid-column:1/3;padding:14px 12px 14px 0;font:500 11px/1.45 var(--mono);letter-spacing:.06em;text-transform:uppercase;border-right:var(--b)}
.sec-head h2{grid-column:3/11;padding:12px clamp(14px,2vw,28px) 16px;font:800 clamp(2.1rem,5vw,5.2rem)/.9 var(--grot);font-stretch:75%;text-transform:uppercase;letter-spacing:-.005em}
.sec-head h2:last-child{grid-column:3/-1}
.sec-head .side{grid-column:11/13;border-left:var(--b);display:flex}
.sec-head .side a{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;width:100%;padding:14px 0 14px 16px;font:700 12px/1.25 var(--grot);letter-spacing:.07em;text-transform:uppercase;transition:background .2s,color .2s,padding .2s}
.sec-head .side a:hover{background:var(--ink);color:var(--on-ink);padding-right:12px}
@media (max-width:800px){
  .sec-head .n{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--hair)}
  .sec-head h2,.sec-head h2:last-child{grid-column:1/-1;padding-left:0}
  .sec-head .side{grid-column:1/-1;border-left:0;border-top:var(--b)}
}

/* Board: ruled grid of cells (borders collapse via negative margins) */
.board{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));padding:0 2px 2px 0;margin-top:-2px}
.board > *{border:var(--b);margin:0 -2px -2px 0;min-width:0}
.board.sel{grid-template-columns:repeat(12,minmax(0,1fr))}
.sel .s1,.sel .s4{grid-column:span 7}
.sel .s2,.sel .s3{grid-column:span 5}
.sel .card{--ih:clamp(300px,36vw,580px)}
.board.cat{margin-bottom:clamp(72px,10vw,140px)}
.board.rel{margin-bottom:0}
@media (max-width:1000px){.board{--cols:2}}
@media (max-width:760px){.sel .s1,.sel .s2,.sel .s3,.sel .s4{grid-column:1/-1}.sel .card{--ih:clamp(300px,90vw,460px)}}
@media (max-width:600px){.board{--cols:1}}

/* Cards */
.card{background:var(--paper);display:flex}
.card-link{display:flex;flex-direction:column;width:100%}
.card-top{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:var(--b);font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.card-img{height:var(--ih,clamp(280px,26vw,440px));display:flex;align-items:center;justify-content:center;padding:clamp(18px,2.6vw,40px);background-color:var(--slab-lt);background-image:var(--tex);background-size:640px 640px;overflow:hidden;border-bottom:var(--b)}
.card-img img{max-height:100%;max-width:100%;width:auto;height:auto;filter:drop-shadow(8px 10px 10px rgba(18,18,17,.25))}
.card-link:hover .card-img img.ready{transform:scale(1.03)}
.card-cap{padding:14px 14px 18px;display:flex;flex-direction:column;gap:3px;flex:1}
.card-title{font:800 clamp(1.25rem,1.6vw,1.6rem)/1.02 var(--grot);font-stretch:87.5%;text-transform:uppercase}
.card-en{font:italic 400 1.15rem/1.2 var(--serif);color:var(--muted)}
.card-meta{font:400 12.5px/1.45 var(--mono);color:var(--muted)}
.card-meta.first{margin-top:8px}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:var(--b);font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:background .2s,color .2s}
.card-foot small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.card-foot .go{display:inline-flex;align-items:center;gap:8px}
.card-link:hover .card-foot,.card-link:focus-visible .card-foot{background:var(--ink);color:var(--on-ink)}
.card-link:hover .card-foot small{color:var(--on-ink-muted)}

/* Index rows (collections) */
.idx{border-top:var(--b);margin-top:-2px}
.idx-row{display:grid;grid-template-columns:72px minmax(0,1.2fr) minmax(0,1fr) 150px 120px 56px;grid-template-areas:"n name sub meta thumb go";align-items:center;border-bottom:var(--b);transition:background .2s,color .2s}
.idx-row > *{padding:12px 14px;min-width:0}
.idx-n{grid-area:n;align-self:stretch;display:flex;align-items:center;padding-left:0;border-right:var(--b);font:500 12px var(--mono)}
.idx-name{grid-area:name;font:800 clamp(1.8rem,3.4vw,3.4rem)/.92 var(--grot);font-stretch:75%;text-transform:uppercase}
.idx-sub{grid-area:sub;font:italic 400 1.3rem/1.2 var(--serif);color:var(--muted)}
.idx-meta{grid-area:meta;font:500 11px/1.6 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.idx-thumb{grid-area:thumb;align-self:stretch;height:116px;padding:12px;border-left:var(--b);background-color:var(--slab-lt);background-image:var(--tex);background-size:640px 640px;display:flex;align-items:center;justify-content:center}
.idx-thumb img{max-height:100%;max-width:100%;width:auto;height:auto}
.idx-go{grid-area:go;display:flex;justify-content:center}
.idx-row:hover{background:var(--ink);color:var(--on-ink)}
.idx-row:hover .idx-sub,.idx-row:hover .idx-meta{color:var(--on-ink-muted)}
.idx-row:hover .idx-go .ico{transform:translateX(4px)}
.idx-go .ico{transition:transform .3s var(--ease)}
.idx-row.big{grid-template-columns:72px minmax(0,1fr) minmax(0,1fr) 140px 220px 56px}
.idx-row.big .idx-thumb{height:240px}
.idx-row.big .idx-sub{font:400 15px/1.55 var(--grot)}
.idx-row.big .idx-sub i{display:block;font:500 11px/1.5 var(--mono);font-style:normal;letter-spacing:.05em;text-transform:uppercase;margin-top:10px}
@media (max-width:900px){
  .idx-row,.idx-row.big{grid-template-columns:44px minmax(0,1fr) 104px;grid-template-areas:"n name thumb" "n sub thumb" "n meta thumb"}
  .idx-row > *{padding:6px 12px}
  .idx-name{padding-top:14px}
  .idx-meta{padding-bottom:14px}
  .idx-thumb,.idx-row.big .idx-thumb{height:auto;min-height:120px}
  .idx-go{display:none}
}

/* Manifesto */
.manifesto{background-color:var(--ink);background-image:var(--tex);background-size:640px 640px;color:var(--on-ink)}
.manifesto .wrap{padding-block:clamp(72px,10vw,150px)}
.man-head{display:flex;justify-content:space-between;gap:16px;border-top:2px solid var(--on-ink);padding-top:12px;font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--on-ink-muted)}
.man-title{margin-top:clamp(28px,4vw,56px)}
.man-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));margin-top:clamp(36px,5vw,72px);border-top:2px solid var(--on-ink)}
.man-grid > *{min-width:0}
.man-terms{grid-column:1/7;display:grid;grid-template-columns:1fr 1fr;list-style:none;margin:0;padding:0;border-right:2px solid var(--on-ink)}
.man-terms li{padding:18px 16px 24px 0;border-bottom:1px solid var(--ink-line);display:flex;flex-direction:column;gap:10px;font:800 clamp(1.6rem,2.6vw,2.6rem)/1 var(--grot);font-stretch:87.5%;text-transform:uppercase}
.man-terms li:nth-child(even){padding-left:16px;border-left:1px solid var(--ink-line)}
.man-terms span{font:500 11px var(--mono);color:var(--on-ink-muted);letter-spacing:.06em}
.man-body{grid-column:7/13;padding:22px 0 0 clamp(16px,2.4vw,36px);display:flex;flex-direction:column;gap:20px;color:var(--on-ink-muted);font-size:17px}
.man-body p:first-child{font:italic 400 clamp(1.8rem,2.7vw,2.6rem)/1.08 var(--serif);color:var(--on-ink)}
@media (max-width:900px){.man-terms,.man-body{grid-column:1/-1}.man-terms{border-right:0}.man-body{padding-left:0}}

/* Closing slab */
.closing{background-color:var(--slab);background-image:var(--tex);background-size:640px 640px;border-top:var(--b)}
.closing .wrap{padding-block:clamp(80px,12vw,180px);display:flex;flex-direction:column;gap:36px}
.closing h2{font:900 clamp(3rem,8.6vw,9.2rem)/.86 var(--grot);font-stretch:112.5%;text-transform:uppercase;letter-spacing:-.03em;max-width:12ch}
.closing h2 em{font-size:1.08em;letter-spacing:-.02em}
.closing .act{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;border-top:var(--b);padding-top:20px}
.closing .act p{font:500 12px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.04em;max-width:46ch}

/* Footer */
.foot{background:var(--ink);color:var(--on-ink)}
.foot-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-bottom:2px solid var(--on-ink)}
.foot-grid > *{padding:28px 16px 32px;border-left:1px solid var(--ink-line);min-width:0}
.foot-grid > :first-child{border-left:0;padding-left:0}
.foot .c1{grid-column:1/5}.foot .c2{grid-column:5/8}.foot .c3{grid-column:8/10}.foot .c4{grid-column:10/13}
.foot .lab{color:var(--on-ink-muted)}
.foot .ftag{font:600 17px/1.35 var(--grot);margin-top:12px;max-width:26ch}
.foot .domain{display:block;margin-top:14px;font:800 clamp(1.6rem,2.4vw,2.2rem)/1 var(--grot);font-stretch:112.5%;letter-spacing:-.02em;color:var(--ocre)}
.foot ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.foot nav a{font:700 15px/1.3 var(--grot);letter-spacing:.03em;text-transform:uppercase}
.foot nav a:hover{color:var(--on-ink-muted)}
.foot .c3 .lang{margin-top:12px}
.foot .lang button{border-color:var(--on-ink);color:var(--on-ink)}
.foot .lang button[aria-pressed="true"]{background:var(--on-ink);color:var(--ink)}

function grain(c,W,H,amt,weave){
  const d=c.getImageData(0,0,W,H),px=d.data;
  for(let y=0;y<H;y++){for(let x=0;x<W;x++){const i=(y*W+x)*4;let n=(Math.random()-.5)*amt;

  c.putImageData(d,0,0);
}

  for(let s=0;s<=w;s+=st)c.lineTo(x+s,y+(r()-.5)*4);
  for(let s=0;s<=h;s+=st)c.lineTo(x+w+(r()-.5)*5,y+s);
  for(let s=w;s>=0;s-=st)c.lineTo(x+s,y+h+(r()-.5)*7);
  for(let s=h;s>=0;s-=st)c.lineTo(x+(r()-.5)*4,y+s);
  c.closePath();
}

    <div class="strip"><span>${T("heroLabel")}</span><span>${T("brasil")}</span><span>${T("est")}</span><span>${T("count")(ART.length)}</span><span>${T("colsN")(COLS.length)}</span></div>
    <div class="hero-body">
      <div class="hero-text">
        <p class="hero-quote">${T("heroQuote")}</p>
        <p class="hero-sub">${T("heroSub")}</p>
        <div class="hero-ctas"><a class="btn" href="#works">${T("explore")} ${icon("right")}</a><a class="btn ghost" href="#about">${T("discover")} ${icon("right")}</a></div>
      </div>
      <div class="hero-art"><a href="#work-${hero.id}" aria-label="${esc(hero.title)}, ${hero.year}">${slab(hero)}</a></div>
    </div>
  </section>

  <section class="sec wrap" aria-labelledby="sel-t">
    ${secHead("01",T("selEyebrow"),T("selTitle"),"sel-t","#works",T("viewAll"))}
    <div class="board sel">${sel.map((a,i)=>card(a,"s"+(i+1))).join("")}</div>
  </section>

  <section class="sec wrap" aria-labelledby="col-t" style="padding-top:0">
    ${secHead("02",T("colEyebrow"),T("colTitle"),"col-t","#collections",T("allCols"))}
    <div class="idx">${COLS.map((c,i)=>idxRow(c,i)).join("")}</div>
  </section>

  <section class="manifesto" aria-labelledby="man-t"><div class="wrap">
    <div class="man-head"><span>03 — ${T("manEyebrow")}</span><span>PONCI</span></div>
    <h2 class="fit man-title" id="man-t"><span>${T("manTitle")}</span></h2>
    <div class="man-grid">
      <ul class="man-terms">${T("terms").map((w,i)=>`<li><span>${pad(i+1)}</span>${w}</li>`).join("")}</ul>
      <div class="man-body"><p>${T("man1")}</p><p>${T("man2")}</p></div>
    </div>
  </div></section>

  ${closingHTML(`<a class="btn" href="#acquisitions">${T("closeCta")} ${icon("right")}</a>`)}`};
}

function filtered(){
  let list=ART.filter(a=>(state.cat==="all"||a.cat===state.cat)&&(state.col==="all"||a.col===state.col));
  list.sort((x,y)=>state.sort==="new"?y.date.localeCompare(x.date):x.date.localeCompare(y.date));
  return list;
}
function resultsHTML(){
  const list=filtered();
  const meta=`<div class="results-meta" aria-live="polite"><span>${T("count")(list.length)}</span>${(state.cat!=="all"||state.col!=="all")?`<button type="button" data-clear>${T("clear")}</button>`:""}</div>`;
  if(!list.length)return meta+`<div class="empty"><p>${T("emptyT")}</p><p style="color:var(--muted)">${T("emptyB")}</p><button class="btn ghost" type="button" data-clear>${T("clear")} ${icon("x")}</button></div>`;
  return meta+`<div class="board cat">${list.map(a=>card(a)).join("")}</div>`;
}
function vWorks(){
  const cats=["all","painting","mixed","paper","edition"];
  const chip=(key,val,label)=>`<button type="button" class="chip" data-f="${key}" data-v="${val}" aria-pressed="${state[key]===val}">${label}</button>`;
  return {title:"PONCI — "+T("works"),html:`
  <div class="wrap">
    <header class="page-head"><h1 class="fit"><span>${T("works")}</span></h1>
      <div class="page-strip"><p class="lab">${T("index")}</p><p class="intro">${T("worksIntro")}</p><p class="count">${T("count")(ART.length)}</p></div>
    </header>
    <div class="filters" role="region" aria-label="${T("category")} / ${T("collection")}">
      <div class="frow" role="group" aria-label="${T("category")}"><span class="lab">${T("category")}</span>${cats.map(c=>chip("cat",c,c==="all"?T("all"):T("cat")[c])).join("")}</div>
      <div class="frow" role="group" aria-label="${T("collection")}"><span class="lab">${T("collection")}</span>${chip("col","all",T("all"))}${COLS.map(c=>chip("col",c.id,esc(c.name))).join("")}</div>
      <div class="frow"><label class="lab" for="sort">${T("sort")}</label><div class="sortwrap"><select id="sort"><option value="new"${state.sort==="new"?" selected":""}>${T("newest")}</option><option value="old"${state.sort==="old"?" selected":""}>${T("oldest")}</option></select></div></div>
    </div>
    <div id="results">${resultsHTML()}</div>
  </div>`,after(){$("#sort").addEventListener("change",e=>{state.sort=e.target.value;refreshResults();});}};
}
function refreshResults(){
  const box=$("#results");if(!box)return;box.innerHTML=resultsHTML();
  $$(".chip").forEach(b=>b.setAttribute("aria-pressed",String(state[b.dataset.f]===b.dataset.v)));
  hydrate(box);
}

function vDetail(id){
  const a=byId(id);if(!a)return vNotFound();
  const i=ART.indexOf(a),prev=ART[(i-1+ART.length)%ART.length],next=ART[(i+1)%ART.length],c=colById(a.col);
  let rel=ART.filter(x=>x!==a&&x.col===a.col);
  ART.filter(x=>x!==a&&!rel.includes(x)&&x.cat===a.cat).forEach(x=>rel.push(x));
  ART.filter(x=>x!==a&&!rel.includes(x)).forEach(x=>rel.push(x));
  rel=rel.slice(0,3);
  return {title:`${a.title}, ${a.year} — PONCI`,html:`
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="#works">${T("works")}</a><span aria-hidden="true">/</span><a href="#collection-${c.id}">${esc(c.name)}</a><span aria-hidden="true">/</span><span aria-current="page">${esc(a.title)}</span></nav>
    <article class="detail">
      <div class="detail-media">${slab(a)}</div>
      <div class="detail-info">
        <div class="d-no"><span>${T("catNo")}</span><span>${a.no} / ${String(ART.length).padStart(3,"0")}</span></div>
        <div><h1 class="d-title">${esc(a.title)}</h1>${state.lang==="en"?`<p class="d-en">${esc(a.en)}</p>`:""}</div>
        <div class="d-artist"><strong>${esc(a.artist)}</strong><span>${T("fictional")}</span></div>
        <dl class="spec">
          <dt>${T("year")}</dt><dd>${a.year}</dd>
          <dt>${T("medium")}</dt><dd>${esc(L(a.medium))}</dd>
          <dt>${T("dims")}</dt><dd>${dims(a)}<small>${dimsIn(a)}</small></dd>
          <dt>${T("edition")}</dt><dd>${a.ed?esc(L(a.ed)):T("unique")}</dd>
          <dt>${T("collection")}</dt><dd><a href="#collection-${c.id}">${esc(c.name)}</a></dd>
          <dt>${T("category")}</dt><dd>${T("cat")[a.cat]}</dd>
        </dl>
        <div class="d-desc">${L(a.d).map(p=>`<p>${esc(p)}</p>`).join("")}</div>
        <div class="d-buy">${priceHTML(a)}<a class="btn" href="#acquisitions" data-inquire="${a.id}">${T("inquireWork")} ${icon("right")}</a></div>
        <p class="notice">${icon("info")}<span>${T("demoNote")}</span></p>
      </div>
    </article>
    <nav class="pager" aria-label="${T("works")}">
      <a href="#work-${prev.id}"><span>${icon("left")} ${T("prev")}</span><strong>${esc(prev.title)}</strong></a>
      <a href="#work-${next.id}"><span>${T("next")} ${icon("right")}</span><strong>${esc(next.title)}</strong></a>
    </nav>
    <section class="sec" aria-labelledby="rel-t">
      ${secHead("—",T("related"),esc(c.name),"rel-t","#works",T("viewAll"))}
      <div class="board rel">${rel.map(x=>card(x)).join("")}</div>
    </section>
  </div>`};
}

function vCollections(){
  return {title:"PONCI — "+T("collections"),html:`
  <div class="wrap">
    <header class="page-head"><h1 class="fit"><span>${T("collections")}</span></h1>
      <div class="page-strip"><p class="lab">${T("index")}</p><p class="intro">${T("colsIntro")}</p><p class="count">${T("colsN")(COLS.length)}</p></div>
    </header>
    <div class="idx" style="margin:clamp(36px,5vw,64px) 0 clamp(72px,10vw,140px)">${COLS.map((c,i)=>idxRow(c,i,true)).join("")}</div>
  </div>`};
}

function vCollection(id){
  const c=colById(id);if(!c)return vNotFound();
  const ci=COLS.indexOf(c),list=worksIn(c.id),cov=byId(c.cover),others=COLS.filter(x=>x!==c);
  return {title:`${c.name} — PONCI`,html:`
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="#collections">${T("collections")}</a><span aria-hidden="true">/</span><span aria-current="page">${esc(c.name)}</span></nav>
    <header class="page-head"><h1 class="fit"><span>${esc(c.name)}</span></h1>
      <div class="page-strip"><p class="lab">${T("collection")} ${ROMAN[ci]}</p><p class="intro">${state.lang==="en"?`<em>${esc(c.en)}.</em> `:""}${esc(L(c.d))}</p><p class="count">${c.year}<br>${T("count")(list.length)}<br>${esc(L(c.media))}</p></div>
    </header>
    <div class="plate">${slab(cov,"clamp(440px,76vh,860px)")}</div>
    <section class="sec" aria-labelledby="cw-t" style="padding-bottom:0">
      ${secHead("—",T("worksN"),T("count")(list.length),"cw-t","#works",T("inCatalogue"),` data-setcol="${c.id}"`)}
      <div class="board rel">${list.map(a=>card(a)).join("")}</div>
    </section>
    <section class="sec" aria-labelledby="oc-t">
      ${secHead("—",T("collections"),T("others"),"oc-t","#collections",T("allCols"))}
      <div class="idx">${others.map(o=>idxRow(o,COLS.indexOf(o))).join("")}</div>
    </section>
  </div>`};
}

function vAbout(){
  const S=T("aboutSecs"),plate=byId("sedimento");
  const sec=(s,i)=>`<section class="about-sec" aria-labelledby="ab-${i}">
      <div class="num"><b>${pad(i+1)}</b><p class="lab">${s.label}</p></div>
      <div class="body"><h2 id="ab-${i}">${s.title}</h2><div class="cols"><p>${s.a}</p><p>${s.b}</p></div></div>
    </section>`;
  return {title:"PONCI — "+T("about"),html:`
  <div class="wrap">
    <header class="about-lead"><p class="lab">${T("aboutEyebrow")}</p><h1>${T("aboutLead")}</h1></header>
    ${sec(S[0],0)}${sec(S[1],1)}
    <figure class="plate">${slab(plate,"clamp(440px,80vh,880px)")}<figcaption class="lab">${T("plateCap")} — ${esc(plate.title)}, ${plate.year}. ${esc(L(plate.medium))}</figcaption></figure>
    ${sec(S[2],2)}${sec(S[3],3)}
  </div>
  ${closingHTML(`<a class="btn" href="#works">${T("explore")} ${icon("right")}</a><a class="btn ghost" href="#acquisitions">${T("closeCta")} ${icon("right")}</a>`)}`};
}

const errs={
  name:v=>v.trim().length<2?T("eName"):"",
  email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?"":T("eEmail"),
  art:v=>v?"":T("eArt"),
  msg:v=>v.trim().length<20?T("eMsg")(v.trim().length):""
};
function field(name,attrs){
  return `<div class="field" id="f-${name}"><label for="i-${name}" class="lab">${T(name)}</label><input id="i-${name}" name="${name}" ${attrs} aria-describedby="e-${name}" required><p class="err" id="e-${name}"></p></div>`;
}
function vAcq(){
  const f=state.form,done=state.done,side=byId(f.art)||byId("porta-para-o-mar-seco");
  const opt=(v,l)=>`<option value="${v}"${f.art===v?" selected":""}>${l}</option>`;
  const formHTML=done?`<div class="success" role="status" tabindex="-1" id="success">
      <span class="mark">${icon("check")}</span>
      <h2>${T("okTitle")}</h2>
      <p>${T("okBody")}</p>
      <dl class="spec"><dt>${T("ref")}</dt><dd>${done.ref}</dd><dt>${T("name")}</dt><dd>${esc(done.name)}</dd><dt>${T("email")}</dt><dd>${esc(done.email)}</dd><dt>${T("art")}</dt><dd>${done.art==="general"?T("general"):esc(byId(done.art)?.title||"")}</dd></dl>
      <p class="notice">${icon("info")}<span>${T("okProto")}</span></p>
      <button type="button" class="btn ghost" id="again">${T("another")} ${icon("right")}</button>
    </div>`:`<form class="form" id="inq" novalidate aria-describedby="form-proto">
      <div class="two">
        ${field("name",`type="text" autocomplete="name" placeholder="${T("phName")}" value="${esc(f.name)}"`)}
        ${field("email",`type="email" autocomplete="email" inputmode="email" placeholder="${T("phEmail")}" value="${esc(f.email)}"`)}
      </div>
      <div class="field" id="f-art"><label for="i-art" class="lab">${T("art")}</label>
        <select id="i-art" name="art" aria-describedby="e-art" required>${opt("",T("choose"))}${opt("general",T("general"))}
          ${COLS.map(c=>`<optgroup label="${esc(c.name)}">${worksIn(c.id).map(a=>opt(a.id,`${esc(a.title)}, ${a.year}`)).join("")}</optgroup>`).join("")}
        </select><p class="err" id="e-art"></p></div>
      <div class="field" id="f-msg"><label for="i-msg" class="lab"><span>${T("msg")}</span><span class="count" id="msg-count">${f.msg.trim().length} / 20+</span></label>
        <textarea id="i-msg" name="msg" rows="5" placeholder="${T("phMsg")}" aria-describedby="e-msg" required>${esc(f.msg)}</textarea><p class="err" id="e-msg"></p></div>
      <p class="form-status" id="form-status" role="alert"></p>
      <div class="form-actions"><button class="btn" type="submit" id="submit">${T("submit")} ${icon("right")}</button><p id="form-proto">${T("formProto")}</p></div>
    </form>`;
  return {title:"PONCI — "+T("acq"),html:`
  <div class="wrap">
    <header class="page-head">
      <p class="lab" style="color:var(--ink)">${T("acqEyebrow")}</p>
      <h1 class="acq-title">${T("acqTitle")}</h1>
      <div class="page-strip" style="margin-top:clamp(24px,3vw,40px)"><p class="lab">PONCI</p><p class="intro">${T("acqIntro")}</p><p class="count">ponci.art</p></div>
    </header>
    <ol class="steps">${T("steps").map((s,i)=>`<li><span class="n">${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p></li>`).join("")}</ol>
    <section class="acq" aria-labelledby="form-t">
      <div class="acq-aside"><p class="lab">${T("formEyebrow")}</p><h2 id="form-t">${T("formTitle")}</h2><p>${T("formAside")}</p><div aria-hidden="true">${slab(side,null,false)}</div></div>
      <div class="acq-main" id="acq-main">${formHTML}</div>
    </section>
  </div>`,after:done?bindSuccess:bindForm};
}
function setErr(name){
  const el=$("#i-"+name);if(!el)return "";
  const m=errs[name](el.value);
  $("#f-"+name).classList.toggle("bad",!!m);
  el.setAttribute("aria-invalid",m?"true":"false");
  $("#e-"+name).textContent=m;
  return m;
}
function bindForm(){
  const f=$("#inq");if(!f)return;
  Object.keys(state.touched).forEach(n=>state.touched[n]&&setErr(n));
  f.addEventListener("input",e=>{const el=e.target;if(!el.name)return;state.form[el.name]=el.value;
    if(el.name==="msg")$("#msg-count").textContent=`${el.value.trim().length} / 20+`;
    if(state.touched[el.name])setErr(el.name);
    if(el.name==="art"){state.touched.art=true;setErr("art");}});
  f.addEventListener("focusout",e=>{const n=e.target.name;if(n&&e.target.value!==""){state.touched[n]=true;setErr(n);}});
  f.addEventListener("submit",e=>{
    e.preventDefault();
    const names=["name","email","art","msg"];names.forEach(n=>state.touched[n]=true);
    const bad=names.filter(n=>setErr(n));
    $("#form-status").textContent=bad.length?T("fix"):"";
    if(bad.length){$("#i-"+bad[0]).focus();return;}
    const b=$("#submit");b.disabled=true;b.innerHTML=T("sending");
    setTimeout(()=>{
      state.done={...state.form,ref:"PNC-INQ-"+(1000+Math.floor(Math.random()*9000))};
      state.form={name:"",email:"",art:"",msg:""};state.touched={};
      render(false);
      const s=$("#success");if(s){s.scrollIntoView({block:"center"});s.focus({preventScroll:true});}
    },900);
  });
}
function bindSuccess(){$("#again")?.addEventListener("click",()=>{state.done=null;render(false);$("#i-name")?.focus();});}
function vNotFound(){return {title:"PONCI",html:`<div class="wrap nf"><p class="lab">404</p><h1>${T("nfTitle")}</h1><a class="btn" href="#home">${T("nfBack")} ${icon("right")}</a></div>`};}

/* ---------- Router ---------- */
function view(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h||h==="home")return vHome();
  if(h==="works")return vWorks();
  if(h.startsWith("work-"))return vDetail(h.slice(5));
  if(h==="collections")return vCollections();
  if(h.startsWith("collection-"))return vCollection(h.slice(11));
  if(h==="about")return vAbout();
  if(h==="acquisitions")return vAcq();
  return vNotFound();
}
function render(fresh){
  const y=window.scrollY;
  renderChrome();
  const v=view(),main=$("#main");
  main.innerHTML=v.html;document.title=v.title;
  if(fresh){main.classList.remove("enter");void main.offsetWidth;main.classList.add("enter");}
  v.after&&v.after();
  hydrate(main);fit();
  if(fresh){window.scrollTo({top:0,behavior:"instant"});main.focus({preventScroll:true});}
  else window.scrollTo({top:y,behavior:"instant"});
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-lang],[data-f],[data-clear],[data-inquire],[data-setcol],#menu-btn,#menu-close,#menu a");
  if(!t)return;
  if(t.dataset.lang){state.lang=t.dataset.lang;try{localStorage.setItem("ponci-lang-v2",state.lang);}catch(err){}
    const inMenu=!$("#menu").hidden;render(false);if(inMenu){$("#menu").hidden=false;$(`#menu [data-lang="${state.lang}"]`)?.focus();}else $(`#nav [data-lang="${state.lang}"]`)?.focus();return;}
  if(t.dataset.f){state[t.dataset.f]=t.dataset.v;refreshResults();return;}
  if(t.hasAttribute("data-clear")){state.cat="all";state.col="all";refreshResults();$('.chip[data-f="cat"]')?.focus();return;}
  if(t.dataset.inquire){state.form.art=t.dataset.inquire;state.done=null;state.touched={};return;}
  if(t.dataset.setcol){state.col=t.dataset.setcol;state.cat="all";return;}
  if(t.id==="menu-btn"){openMenu();return;}
  if(t.id==="menu-close"){closeMenu(true);return;}
  if(t.matches("#menu a"))closeMenu(false);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu(true);});
$("#skip").addEventListener("click",()=>$("#main").focus());
window.addEventListener("hashchange",()=>{closeMenu(false);render(true);});
window.addEventListener("scroll",()=>$("#head").classList.toggle("scrolled",window.scrollY>8),{passive:true});
window.addEventListener("resize",()=>{if(window.innerWidth>900)closeMenu(false);});

render(true);
})();
</script>

</body></html>
